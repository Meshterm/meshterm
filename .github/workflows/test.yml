name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

env:
  PIP_CONFIG_FILE: /dev/null
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Install locked dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --no-build-isolation -r requirements/dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation -e .
      - name: Run ruff
        run: ruff check meshterm tests
      - name: Run black
        run: black --check meshterm tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies
        run: |
          python -m pip install --index-url https://pypi.org/simple --require-hashes --no-build-isolation -r requirements/dev.lock
          python -m pip install --no-index --no-deps --no-build-isolation -e .
      - name: Run tests with coverage
        run: pytest tests/ -v --cov=meshterm --cov-branch --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Install security tools
        run: python -m pip install --index-url https://pypi.org/simple --require-hashes -r requirements/security.lock
      - name: Audit dependencies
        run: pip-audit -r requirements/dev.lock
      - name: Scan Python security issues
        run: bandit -r meshterm -ll
      - name: Scan tracked files for secrets
        run: detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - name: Scan git history for secrets
        if: env.GITLEAKS_LICENSE != ''
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
